<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제주 여행 에이전트</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: #f0f9ff; color: #1e293b; }
        header { padding: 14px 16px; text-align: center; font-weight: 700; color: #fff; background: linear-gradient(135deg, #38bdf8, #0369a1); }
        main { flex: 1; display: flex; min-height: 0; }
        #left { width: 420px; display: flex; flex-direction: column; border-right: 1px solid #bae6fd; min-height: 0; }
        #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
        .bubble { max-width: 90%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .me { align-self: flex-end; background: #0369a1; color: #fff; border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: #fff; border: 1px solid #bae6fd; border-bottom-left-radius: 4px; }
        .step { align-self: flex-start; font-size: 12px; color: #475569; background: #e0f2fe; border-radius: 999px; padding: 3px 10px; }
        #examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; }
        #examples button { font-size: 12px; background: #fff; border: 1px solid #7dd3fc; color: #0369a1; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
        form { display: flex; gap: 8px; padding: 10px 14px; }
        input { flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px; border: 2px solid #bae6fd; border-radius: 12px; }
        form button { padding: 0 18px; font-size: 16px; color: #fff; background: #0369a1; border: 0; border-radius: 12px; cursor: pointer; }
        button:disabled { opacity: .5; cursor: default; }
        #map { flex: 1; }
        @media (max-width: 800px) {
            main { flex-direction: column-reverse; }
            #left { width: auto; flex: 1; border-right: 0; }
            #map { flex: none; height: 38vh; }
        }
    </style>
</head>
<body>
    <header>🌴 제주 여행 에이전트 — 날씨와 장소를 직접 확인하고 추천해요</header>
    <main>
        <div id="left">
            <div id="chat"></div>
            <div id="examples"></div>
            <form id="form">
                <input id="q" placeholder="예: 내일 서귀포에서 뭐 하지?" autocomplete="off" maxlength="200">
                <button id="send">보내기</button>
            </form>
        </div>
        <div id="map"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script>
        const $ = (id) => document.getElementById(id)
        const chat = $('chat')
        const history = []   // {role, content} 텍스트만 보관

        const map = L.map('map').setView([33.38, 126.55], 9)
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map)
        const markers = L.layerGroup().addTo(map)

        function add(cls, text) {
            const d = document.createElement('div')
            d.className = cls
            d.textContent = text
            chat.appendChild(d)
            chat.scrollTop = chat.scrollHeight
            return d
        }

        function showSpots(spots) {
            markers.clearLayers()
            const pts = []
            for (const s of spots) {
                if (s.lat === undefined) continue
                const box = document.createElement('div')
                box.textContent = s.name + ' (' + (s.indoor ? '실내' : '야외') + ') - ' + s.desc
                L.marker([s.lat, s.lon]).bindPopup(box).addTo(markers)
                pts.push([s.lat, s.lon])
            }
            if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 })
        }

        async function ask(text) {
            add('bubble me', text)
            history.push({ role: 'user', content: text })
            $('send').disabled = true
            const wait = add('bubble bot', '생각하는 중...')
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({ messages: history })
                })
                const data = await res.json()
                wait.remove()
                if (!res.ok) { add('bubble bot', data.error || '오류가 났어요.'); history.pop(); return }
                for (const s of data.steps) {
                    const args = Object.values(s.input).join(', ')
                    add('step', '🔧 ' + s.tool + '(' + args + ')')
                }
                add('bubble bot', data.reply)
                history.push({ role: 'assistant', content: data.reply })
                if (data.spots.length) showSpots(data.spots)
            } catch (e) {
                wait.remove()
                add('bubble bot', '서버에 연결하지 못했어요.')
                history.pop()
            } finally {
                $('send').disabled = false
            }
        }

        $('form').addEventListener('submit', (e) => {
            e.preventDefault()
            const text = $('q').value.trim()
            if (!text) return
            $('q').value = ''
            ask(text)
        })

        for (const t of ['오늘 제주시에서 갈 만한 곳 추천해줘', '내일 비 오면 서귀포에서 어디 가지?', '동쪽 야외 코스 알려줘']) {
            const b = document.createElement('button')
            b.type = 'button'
            b.textContent = t
            b.onclick = () => ask(t)
            $('examples').appendChild(b)
        }

        add('bubble bot', '안녕하세요! 지역과 날짜를 말해 주시면 날씨를 확인하고 어울리는 관광지를 골라 드릴게요.')
    </script>
</body>
</html>
